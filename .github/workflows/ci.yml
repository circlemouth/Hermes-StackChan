name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ai-server:
    name: ai-server (build + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ai-server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
